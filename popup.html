<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Toggle</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <header class="header">
            <div class="brand">
                <span class="brand-icon">🌙</span>
                <div class="brand-text">
                    <h1>Dark Mode</h1>
                    <p class="subtitle">Instant theme control</p>
                </div>
            </div>
            <div class="header-status">
                <span id="status-text" class="status-pill">Loading...</span>
                <span class="status-indicator" id="status-indicator"></span>
            </div>
        </header>

        <main class="content">
            <section class="mode-card">
                <div class="mode-text">
                    <h2>Appearance</h2>
                    <p>Enable dark mode for the current site.</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </section>

            <section class="info-card">
                <span class="info-label">Active site</span>
                <div class="domain-info">
                    <span id="current-domain">example.com</span>
                </div>
            </section>

            <section class="controls">
                <button id="reset-btn" class="control-btn secondary">
                    <span class="icon">🔄</span>
                    <span class="label">Reset</span>
                </button>
                <button id="settings-btn" class="control-btn primary">
                    <span class="icon">⚙️</span>
                    <span class="label">Settings</span>
                </button>
            </section>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
